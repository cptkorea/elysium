[package]
name = "logos"
version = "0.1.0"
edition = "2021"

[dependencies]
bincode = "1.3"
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0.49"
tokio = { version = "1.32", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net"] }
tonic = "0.12"

[build-dependencies]
tonic-build = "0.12"
