name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Build CI image
      run: docker build -t elysium-ci -f .github/Dockerfile.ci .
    - name: Build
      run: docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace elysium-ci cargo build --verbose
    - name: Run tests
      run: docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace elysium-ci cargo test --verbose
